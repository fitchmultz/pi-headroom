<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="t d">
  <title id="t">Posthorse flow</title>
  <desc id="d">Two paths reach the same native Pi context-window boundary: the model checkpoints on purpose and calls new_context, or Pi's enabled automatic compaction becomes a no-summary rollover with a bounded recovery record. The fresh window restores notes, todos, and history from the complete on-disk transcript.</desc>

  <style>
    .sans { font-family: Inter, ui-sans-serif, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .title { font-size: 46px; font-weight: 700; fill: #F8FAFC; letter-spacing: -1px; }
    .subtitle { font-size: 17px; fill: #91A0B8; }
    .eyebrow { font-size: 12px; fill: #7488A3; letter-spacing: 3px; }
    .lane { font-size: 11px; letter-spacing: 2px; }
    .cardtitle { font-size: 20px; font-weight: 700; fill: #F8FAFC; }
    .cardbody { font-size: 16px; fill: #B7C1D4; }
    .cardtitle-inv { font-size: 26px; font-weight: 700; fill: #FFFFFF; }
    .cardbody-inv { font-size: 16px; fill: #E0E7FF; }
    .cardmono-inv { font-size: 14px; fill: #C7D2FE; }
    .chip { font-size: 10.5px; letter-spacing: 1.5px; text-anchor: middle; }
    .port { font-size: 10.5px; letter-spacing: 1px; text-anchor: middle; fill: #4F46E5; }
    .storename { font-size: 14px; font-weight: 700; fill: #F8FAFC; }
    .storebody { font-size: 13.5px; fill: #91A0B8; }
    .micro { font-size: 11px; fill: #7488A3; letter-spacing: 1.5px; }
    .footer { font-size: 11.5px; fill: #7488A3; text-anchor: middle; letter-spacing: 1px; }
    .icon { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#22304A"/>
    </pattern>
    <radialGradient id="bloom" gradientUnits="userSpaceOnUse" cx="992" cy="550" r="460">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boundary-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B52F0"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#60A5FA"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#818CF8"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect width="1600" height="1080" fill="#0B1120"/>
  <rect width="1600" height="1080" fill="url(#dots)"/>
  <rect width="1600" height="1080" fill="url(#bloom)"/>

  <!-- title block -->
  <text class="mono eyebrow" x="72" y="84">PI EXTENSION — FRESH CONTEXT. SAME JOURNEY.</text>
  <text class="sans title" x="72" y="134">Posthorse</text>
  <text class="sans subtitle" x="72" y="170">One native hard cutover, reached by the model on purpose or by Pi as a fallback — never an automatic lossy summary.</text>

  <!-- tool surface (top right) -->
  <g id="tools">
    <text class="mono eyebrow" x="1528" y="100" text-anchor="end">TOOLS</text>
    <rect x="1074" y="116" width="106" height="26" rx="13" fill="#1E1B4B"/>
    <text class="mono chip" x="1127" y="133" fill="#A5B4FC">new_context</text>
    <rect x="1190" y="116" width="184" height="26" rx="13" fill="#1E293B"/>
    <text class="mono chip" x="1282" y="133" fill="#91A0B8">get_context_remaining</text>
    <rect x="1384" y="116" width="59" height="26" rx="13" fill="#1E293B"/>
    <text class="mono chip" x="1413.5" y="133" fill="#91A0B8">notes</text>
    <rect x="1453" y="116" width="75" height="26" rx="13" fill="#1E293B"/>
    <text class="mono chip" x="1490.5" y="133" fill="#91A0B8">history</text>
  </g>

  <!-- lane surfaces -->
  <g id="lane-a">
    <rect x="56" y="244" width="696" height="288" rx="20" fill="#0E1525" fill-opacity="0.75" stroke="#1E293B" stroke-width="1"/>
    <rect x="56" y="268" width="4" height="240" rx="2" fill="#60A5FA"/>
    <text class="mono lane" x="72" y="232" fill="#60A5FA">MODEL-DRIVEN · EXPLICIT CHECKPOINT</text>
  </g>
  <g id="lane-b">
    <rect x="56" y="568" width="696" height="288" rx="20" fill="#0E1525" fill-opacity="0.75" stroke="#1E293B" stroke-width="1"/>
    <rect x="56" y="592" width="4" height="240" rx="2" fill="#F59E0B"/>
    <text class="mono lane" x="72" y="556" fill="#F59E0B">PI-DRIVEN · AUTOMATIC FALLBACK</text>
  </g>

  <!-- on-disk zone -->
  <g id="disk-zone">
    <rect x="72" y="900" width="1456" height="112" rx="16" fill="#0E1525" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="mono micro" x="96" y="946">ON DISK · SURVIVES RESETS AND RESTARTS</text>
    <text class="sans storebody" x="96" y="972">Nothing is summarized away. Every window stays in the append-only transcript,</text>
    <text class="sans storebody" x="96" y="992">and the notes tool keeps durable state beside it.</text>
  </g>

  <!-- connectors (behind cards) -->
  <!-- explicit path: Save -> boundary port -->
  <line x1="736" y1="388" x2="776" y2="388" stroke="#60A5FA" stroke-width="3" marker-end="url(#arr-blue)"/>
  <!-- automatic path: Recovery record -> boundary port -->
  <line x1="736" y1="712" x2="776" y2="712" stroke="#F59E0B" stroke-width="3" marker-end="url(#arr-amber)"/>
  <!-- boundary -> fresh window -->
  <line x1="1144" y1="550" x2="1218" y2="550" stroke="#818CF8" stroke-width="3" marker-end="url(#arr-indigo)"/>
  <text class="mono micro" x="1181" y="538" text-anchor="middle" fill="#A5B4FC">CONTINUE</text>
  <!-- boundary -> session JSONL -->
  <line x1="992" y1="856" x2="992" y2="912" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arr-indigo)"/>
  <text class="mono micro" x="1004" y="889">PERSISTED ENTRY</text>
  <!-- disk -> fresh window (read on demand) -->
  <line x1="1376" y1="916" x2="1376" y2="700" stroke="#818CF8" stroke-width="2.5" marker-end="url(#arr-indigo)"/>
  <text class="mono micro" x="1388" y="800">READ ON DEMAND</text>
  <text class="mono micro" x="1388" y="818">notes · history</text>

  <!-- A1: Signal -->
  <g id="card-signal">
    <rect x="72" y="260" width="312" height="256" rx="16" fill="#131D33" stroke="#243049" stroke-width="1.5" filter="url(#soft)"/>
    <g class="icon" stroke="#60A5FA" transform="translate(96 282)">
      <path d="M0 12 H6 L9 4 L13 20 L16 12 H24"/>
    </g>
    <text class="sans cardtitle" x="132" y="301">Signal</text>
    <text class="sans cardbody" x="96" y="344">Stable guidance in the system</text>
    <text class="sans cardbody" x="96" y="366">prompt, no changing meter, so</text>
    <text class="sans cardbody" x="96" y="388">the prefix stays cacheable.</text>
    <text class="sans cardbody" x="96" y="410">One best-effort reminder before</text>
    <text class="sans cardbody" x="96" y="432">the line, never at or past it.</text>
    <text class="sans cardbody" x="96" y="454">Native estimate on request.</text>
    <rect x="96" y="472" width="232" height="26" rx="13" fill="#12253F"/>
    <text class="mono chip" x="212" y="489" fill="#60A5FA">ONCE PER WINDOW · BEST-EFFORT</text>
  </g>

  <!-- A2: Save -->
  <g id="card-save">
    <rect x="424" y="260" width="312" height="256" rx="16" fill="#131D33" stroke="#243049" stroke-width="1.5" filter="url(#soft)"/>
    <g class="icon" stroke="#60A5FA" transform="translate(448 282)">
      <path d="M6 3 H15 L19 7 V21 H6 Z"/>
      <path d="M15 3 V7 H19"/>
      <path d="M9.5 12 H15.5 M9.5 16 H15.5"/>
    </g>
    <text class="sans cardtitle" x="484" y="301">Save</text>
    <text class="sans cardbody" x="448" y="344">Stop normal work. Put concise</text>
    <text class="sans cardbody" x="448" y="366">continuation state in the</text>
    <text class="sans cardbody" x="448" y="388">handoff, or richer durable</text>
    <text class="sans cardbody" x="448" y="410">state in .pi/notes/ first.</text>
    <text class="sans cardbody" x="448" y="432">Then call new_context.</text>
    <rect x="448" y="472" width="136" height="26" rx="13" fill="#12253F"/>
    <text class="mono chip" x="516" y="489" fill="#60A5FA">HANDOFF · NOTES</text>
  </g>

  <!-- B1: Trigger -->
  <g id="card-trigger">
    <rect x="72" y="584" width="312" height="256" rx="16" fill="#131D33" stroke="#243049" stroke-width="1.5" filter="url(#soft)"/>
    <g class="icon" stroke="#F59E0B" transform="translate(96 606)">
      <path d="M13 2 L5 14 H12 L11 22 L19 10 H12 Z"/>
    </g>
    <text class="sans cardtitle" x="132" y="625">Trigger</text>
    <text class="sans cardbody" x="96" y="668">Pi's enabled compaction fires</text>
    <text class="sans cardbody" x="96" y="690">on threshold, overflow, or a</text>
    <text class="sans cardbody" x="96" y="712">restart into a smaller model.</text>
    <text class="sans cardbody" x="96" y="734">Posthorse claims the trigger</text>
    <text class="sans cardbody" x="96" y="756">with newContext — no summary.</text>
    <text class="sans cardbody" x="96" y="778">Manual /compact is untouched.</text>
    <rect x="96" y="796" width="216" height="26" rx="13" fill="#3A2A10"/>
    <text class="mono chip" x="204" y="813" fill="#F59E0B">FOLLOWS compaction.enabled</text>
  </g>

  <!-- B2: Recovery record -->
  <g id="card-record">
    <rect x="424" y="584" width="312" height="256" rx="16" fill="#131D33" stroke="#243049" stroke-width="1.5" filter="url(#soft)"/>
    <g class="icon" stroke="#F59E0B" transform="translate(448 606)">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M7 9 H17 M7 13 H17 M7 17 H13"/>
    </g>
    <text class="sans cardtitle" x="484" y="625">Recovery record</text>
    <text class="sans cardbody" x="448" y="668">Owner inputs, ask_question</text>
    <text class="sans cardbody" x="448" y="690">answers, visible coordination,</text>
    <text class="sans cardbody" x="448" y="712">unconsumed tool batch: labeled,</text>
    <text class="sans cardbody" x="448" y="734">chronological, ≤ 20k chars.</text>
    <text class="sans cardbody" x="448" y="756">Older checkpoint marked stale.</text>
    <text class="sans cardbody" x="448" y="778">Assistant prose is not state.</text>
    <rect x="448" y="796" width="184" height="26" rx="13" fill="#3A2A10"/>
    <text class="mono chip" x="540" y="813" fill="#F59E0B">EMERGENCY INPUT RECORD</text>
  </g>

  <!-- boundary (primary) -->
  <g id="card-boundary">
    <rect x="840" y="244" width="304" height="612" rx="20" fill="url(#boundary-fill)" filter="url(#soft)"/>
    <rect x="840.75" y="244.75" width="302.5" height="610.5" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
    <text class="mono lane" x="872" y="284" fill="#C7D2FE">NATIVE PI BOUNDARY</text>
    <rect x="872" y="306" width="104" height="26" rx="13" fill="#FFFFFF"/>
    <text class="mono chip" x="924" y="323" fill="#4F46E5">NO SUMMARY</text>
    <rect x="988" y="306" width="96" height="26" rx="13" fill="#FFFFFF"/>
    <text class="mono chip" x="1036" y="323" fill="#4F46E5">PERSISTED</text>
    <!-- old window (dashed, dropped) | fresh window (solid) -->
    <g class="icon" stroke="#FFFFFF" stroke-width="2" transform="translate(1078 264) scale(1.7)">
      <rect x="1" y="4" width="9" height="16" rx="2" stroke-opacity="0.6" stroke-linecap="butt" stroke-dasharray="2.6 2.2"/>
      <rect x="14" y="4" width="9" height="16" rx="2"/>
      <path d="M17 12 H20"/>
    </g>
    <text class="sans cardtitle-inv" x="872" y="446">Hard cutover</text>
    <text class="mono cardmono-inv" x="872" y="474">context_window entry</text>
    <text class="sans cardbody-inv" x="872" y="516">Lands between turns, after</text>
    <text class="sans cardbody-inv" x="872" y="540">the complete tool batch.</text>
    <text class="sans cardbody-inv" x="872" y="564">The old window leaves model</text>
    <text class="sans cardbody-inv" x="872" y="588">input; the handoff or</text>
    <text class="sans cardbody-inv" x="872" y="612">recovery record is the first</text>
    <text class="sans cardbody-inv" x="872" y="636">state in the fresh one.</text>
    <text class="sans cardbody-inv" x="872" y="762">A late reminder from the old</text>
    <text class="sans cardbody-inv" x="872" y="786">window is filtered out of</text>
    <text class="sans cardbody-inv" x="872" y="810">model input. The transcript</text>
    <text class="sans cardbody-inv" x="872" y="834">is never rewritten.</text>

    <!-- input ports -->
    <rect x="780" y="372" width="132" height="32" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
    <text class="mono port" x="846" y="392">new_context</text>
    <rect x="780" y="696" width="132" height="32" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
    <text class="mono port" x="846" y="716">compaction hook</text>
  </g>

  <!-- fresh window -->
  <g id="card-fresh">
    <rect x="1224" y="406" width="304" height="288" rx="16" fill="#131D33" stroke="#6366F1" stroke-opacity="0.7" stroke-width="1.5" filter="url(#glow)"/>
    <g class="icon" stroke="#A5B4FC" transform="translate(1248 428)">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M8 13 L11 16 L16 10"/>
    </g>
    <text class="sans cardtitle" x="1284" y="447">Fresh window</text>
    <text class="sans cardbody" x="1248" y="494">Restore notes and todo state.</text>
    <text class="sans cardbody" x="1248" y="518">Search history when needed.</text>
    <text class="sans cardbody" x="1248" y="542">Verify live state before</text>
    <text class="sans cardbody" x="1248" y="566">stateful or external work,</text>
    <text class="sans cardbody" x="1248" y="590">then continue the task.</text>
    <rect x="1248" y="640" width="160" height="26" rx="13" fill="#1E1B4B"/>
    <text class="mono chip" x="1328" y="657" fill="#A5B4FC">RECOVER · CONTINUE</text>
  </g>

  <!-- store: session JSONL -->
  <g id="store-jsonl">
    <rect x="840" y="916" width="304" height="80" rx="12" fill="#131D33" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1.5"/>
    <ellipse cx="870" cy="940" rx="12" ry="5" fill="none" stroke="#818CF8" stroke-width="2"/>
    <path d="M 858 940 L 858 960 A 12 5 0 0 0 882 960 L 882 940" fill="none" stroke="#818CF8" stroke-width="2"/>
    <text class="mono storename" x="896" y="944">session JSONL</text>
    <text class="sans storebody" x="896" y="964">append-only transcript with</text>
    <text class="sans storebody" x="896" y="982">native window boundaries</text>
  </g>

  <!-- store: notes -->
  <g id="store-notes">
    <rect x="1224" y="916" width="304" height="80" rx="12" fill="#131D33" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1.5"/>
    <ellipse cx="1254" cy="940" rx="12" ry="5" fill="none" stroke="#818CF8" stroke-width="2"/>
    <path d="M 1242 940 L 1242 960 A 12 5 0 0 0 1266 960 L 1266 940" fill="none" stroke="#818CF8" stroke-width="2"/>
    <text class="mono storename" x="1280" y="944">.pi/notes/</text>
    <text class="sans storebody" x="1280" y="964">durable state, written before</text>
    <text class="sans storebody" x="1280" y="982">the cut and read after it</text>
  </g>

  <!-- footer -->
  <text class="mono footer" x="800" y="1052">PI COMPACTION DISABLED → NO REMINDER, NO AUTOMATIC ROLLOVER · new_context STAYS AVAILABLE · MANUAL /compact UNCHANGED</text>
</svg>
